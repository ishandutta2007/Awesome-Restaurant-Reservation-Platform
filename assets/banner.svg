<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1e1b4b" />
      <stop offset="80%" stop-color="#172554" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#9d174d" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.6; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.05); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      .glowing-orb {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatFast 4s ease-in-out infinite 0.8s;
      }
      .floating-card-3 {
        animation: floatSlow 5.5s ease-in-out infinite 1.5s;
      }
      .title-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .badge-text {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambience Orbs -->
  <circle class="glowing-orb" cx="180" cy="80" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle class="glowing-orb" cx="1020" cy="280" r="160" fill="#ec4899" opacity="0.2" filter="url(#glow)" />
  <circle class="glowing-orb" cx="600" cy="30" r="100" fill="#06b6d4" opacity="0.18" filter="url(#glow)" />

  <!-- Grid overlay -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Left Side: Interactive Graphic / Badges -->
  <g transform="translate(60, 45)">
    <circle cx="50" cy="50" r="45" fill="#1e293b" stroke="#6366f1" stroke-width="2.5" />
    <circle cx="50" cy="50" r="32" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M 40 33 L 40 52 M 36 33 L 36 43 C 36 47 44 47 44 43 L 44 33 M 40 52 L 40 67" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <path d="M 60 33 C 60 33 63 42 60 48 C 58 52 58 55 58 67 M 60 33 C 58 36 57 44 57 48" stroke="#f472b6" stroke-width="2.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Header Category Pill -->
  <g transform="translate(180, 52)">
    <rect width="270" height="28" rx="14" fill="#312e81" stroke="#6366f1" stroke-width="1" opacity="0.9" />
    <circle cx="16" cy="14" r="5" fill="#22c55e" />
    <text x="30" y="19" fill="#a5b4fc" class="badge-text" font-size="12">CURATED ECOSYSTEM GUIDE</text>
  </g>

  <!-- Main Title -->
  <text x="180" y="125" fill="url(#primaryTextGrad)" class="title-text" font-size="38" filter="url(#glow)">Awesome Restaurant Reservation</text>
  <text x="180" y="165" fill="#f8fafc" class="title-text" font-size="30">Platform &amp; Hospitality Tech</text>

  <!-- Subtitle -->
  <text x="180" y="200" fill="url(#subTextGrad)" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
    The comprehensive directory of Enterprise SaaS Platforms &amp; Open-Source Table Booking Engines
  </text>

  <!-- Feature Cards / Badges Grid (Bottom) -->
  <!-- Card 1: SaaS Platforms -->
  <g class="floating-card-1" transform="translate(80, 238)">
    <rect width="310" height="74" rx="12" fill="url(#cardGrad1)" stroke="#3b82f6" stroke-width="1.2" />
    <circle cx="36" cy="37" r="18" fill="#1e3a8a" />
    <text x="28" y="43" font-size="18">🏢</text>
    <text x="66" y="32" fill="#93c5fd" class="title-text" font-size="14">Enterprise SaaS</text>
    <text x="66" y="52" fill="#cbd5e1" class="badge-text" font-size="11">OpenTable • Resy • SevenRooms • Tock</text>
  </g>

  <!-- Card 2: Open Source -->
  <g class="floating-card-2" transform="translate(430, 238)">
    <rect width="320" height="74" rx="12" fill="url(#cardGrad2)" stroke="#a855f7" stroke-width="1.2" />
    <circle cx="36" cy="37" r="18" fill="#581c87" />
    <text x="28" y="43" font-size="18">⚡</text>
    <text x="66" y="32" fill="#d8b4fe" class="title-text" font-size="14">Open-Source Engines</text>
    <text x="66" y="52" fill="#cbd5e1" class="badge-text" font-size="11">TastyIgniter • Cal.com • QloApps • OpenResto</text>
  </g>

  <!-- Card 3: Operations & CRM -->
  <g class="floating-card-3" transform="translate(790, 238)">
    <rect width="330" height="74" rx="12" fill="url(#cardGrad3)" stroke="#ec4899" stroke-width="1.2" />
    <circle cx="36" cy="37" r="18" fill="#831843" />
    <text x="28" y="43" font-size="18">📊</text>
    <text x="66" y="32" fill="#f472b6" class="title-text" font-size="14">Hospitality CRM &amp; Floor Plans</text>
    <text x="66" y="52" fill="#cbd5e1" class="badge-text" font-size="11">Waitlists • Seating • Direct Bookings</text>
  </g>
</svg>
